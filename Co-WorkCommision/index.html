<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkUs</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/register.css">
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="imagens/WLogo.png" alt="Logo" class="logo">
            <div class="logo-text">
                <span class="work">WORK</span><span class="us">Us</span>
            </div>
        </div>
        <div class="button-container">
            <button class="btn" id="loginBtn">Entrar</button>
            <button class="btn" id="registerBtn">Cadastrar</button>
        </div>
        
      
        <div class="form-container" id="loginForm">
            <h2>Entrar em sua conta</h2>
            <input type="email" placeholder="Email" required>
            <input type="password" placeholder="Senha" required>
            <button class="btn" id="Log">Entrar</button>
        </div>

        <div class="form-container" id="registerForm">
            <h2>Registrar-se</h2>
            <input type="text" placeholder="Nome" required>
            <input type="email" placeholder="Email" required>
            <input type="password" placeholder="Senha" required>
            <label>
                <input type="checkbox" required> Eu concordo com os Termos de Uso.
            </label>
            <button class="btn" id="Reg">Registrar</button>
        </div>
    </div>

    
    <script src="js/script.js"></script>
</body>
</html>
